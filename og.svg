<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Delingsbilde for norske sider (og.png), 1200×630, lyst design. PNG-en lages med ~/nrth-nettside-verktoy/og-render.mjs (Playwright + Chromium headless): node og-render.mjs <repo-rot>. Skriptet legger SVG-en inn i en HTML-side med Figtree fra assets/fonts/figtree-latin.woff2 og Satoshi 700/900 hentet fra Fontshare (api.fontshare.com/v2/css?f[]=satoshi@700,900) under rendering, og tar skjermbilde av svg-elementet i 1200×630. Satoshi-filene skal ikke inn i repoet. -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <!-- Logo -->
  <text x="80" y="136" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="48" font-weight="900" fill="#ff8a5b" letter-spacing="-1.92">&lt;/&gt;</text>
  <text x="178" y="136" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" font-size="40" font-weight="700" fill="#0a0a0a" letter-spacing="-0.8">Nrth AI</text>
  <!-- Overskrift -->
  <text x="78" y="352" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="128" font-weight="700" fill="#0a0a0a" letter-spacing="-5.1">Vi løser AI for</text>
  <text x="78" y="477" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="128" font-weight="700" fill="#0a0a0a" letter-spacing="-5.1">norske bedrifter.</text>
  <!-- Domene -->
  <text x="1120" y="566" font-family="Figtree, ui-sans-serif, system-ui, sans-serif" font-size="24" font-weight="400" fill="#666666" text-anchor="end">nrth.no</text>
  <!-- Oransje linje langs bunnen -->
  <rect x="0" y="626" width="1200" height="4" fill="#ff8a5b"/>
</svg>
